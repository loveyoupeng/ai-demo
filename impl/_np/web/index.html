<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Mode — decoder-only transformer, step by step</title>
<link rel="stylesheet" href="/katex/katex.min.css">
<script defer src="/katex/katex.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222c; --line: #2a2f3a;
    --fg: #e6e9ef; --dim: #9aa3b2; --accent: #5aa9ff; --accent2: #7dcb6f;
    --warn: #e0a35e; --hot: #ff7a59;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 8px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .78rem; color: var(--dim); }
  .badge b { color: var(--fg); font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 14px 18px; max-width: 1600px; margin: 0 auto; }
  @media (min-width: 1100px) { main.record-open { grid-template-columns: 460px 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  label { font-size: .8rem; color: var(--dim); display: block; margin: 8px 0 3px; }
  input[type=text], input[type=number], select { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; font: inherit; }
  input[type=number] { width: 90px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .row > div { min-width: 90px; }
  .grow { flex: 1; min-width: 160px; }
  button { background: var(--accent); color: #04121f; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-family: ui-monospace, monospace; font-size: .9rem; }
  .chip small { color: var(--dim); }
  .chip.gen { border-color: var(--accent2); color: var(--accent2); }
  .big-text { font-size: 1.5rem; font-family: ui-monospace, monospace; letter-spacing: .15em; margin: 6px 0; word-break: break-all; }
  .topbars { margin-top: 10px; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 70px; gap: 8px; align-items: center; font-size: .85rem; margin: 3px 0; }
  .bar { height: 14px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar-row .p { text-align: right; color: var(--dim); font-family: ui-monospace, monospace; }
  #diagram { width: 100%; height: auto; display: block; }
  #diagram .node { cursor: pointer; }
  #diagram .node rect.box { fill: var(--panel2); stroke: var(--line); stroke-width: 1.5; transition: stroke .15s; }
  #diagram .node:hover rect.box { stroke: var(--accent); }
  #diagram .node.active rect.box { stroke: var(--accent); stroke-width: 2.5; fill: #1c2c42; }
  #diagram .mod { fill: #14171d; stroke: var(--line); stroke-width: 1; }
  #diagram text { fill: var(--fg); font-family: system-ui, sans-serif; pointer-events: none; }
  #diagram .t-title { font-size: 13px; font-weight: 600; }
  #diagram .t-sub { fill: var(--dim); font-size: 10px; }
  #diagram .t-cell { fill: var(--dim); font-size: 10.5px; }
  #diagram .cell rect { fill: #232833; stroke: #303748; stroke-width: 1; }
  #diagram .cell:hover rect { stroke: var(--accent); }
  #diagram .cell.active rect { stroke: var(--accent); stroke-width: 2; fill: #1c2c42; }
  #diagram .cell.active text { fill: var(--fg); }
  #diagram .edge { stroke: #3a4252; stroke-width: 1.6; fill: none; }
  #diagram .edge.dashed { stroke-dasharray: 5 4; }
  #diagram .blklabel { fill: var(--dim); font-size: 11px; letter-spacing: .08em; }
  #inspector { min-height: 300px; }
  .heat { display: grid; gap: 1px; margin: 6px 0; width: max-content; }
  .heat i { width: 16px; height: 16px; border-radius: 3px; background: var(--panel2); }
  .heat i.tiny { width: 11px; height: 11px; }
  .matlabel { font-size: .78rem; color: var(--dim); margin-top: 10px; }
  .formula { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; overflow-x: auto; color: var(--fg); }
  .formula .katex { font-size: 1.02em; }
  .note { color: var(--dim); font-size: .85rem; }
  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .step { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-family: ui-monospace, monospace; font-size: .85rem; cursor: pointer; }
  .step.active { border-color: var(--accent); color: var(--accent); }
  .step small { color: var(--dim); }
  .sel-head { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
  .sel-head button { padding: 4px 10px; font-size: .8rem; background: var(--panel2); color: var(--dim); border: 1px solid var(--line); }
  .sel-head button.on { border-color: var(--accent); color: var(--accent); background: #1c2c42; }
  #status { min-height: 1.2em; font-size: .85rem; color: var(--dim); }
  .kv { font-size: .8rem; color: var(--dim); margin: 4px 0; font-family: ui-monospace, monospace; }
  a { color: var(--accent); }
  #record-panel { display: none; }
  main.record-open #record-panel { display: block; }
</style>
</head>
<body>
<header>
  <h1>Learning Mode</h1>
  <div class="badges" id="badges"><span class="badge">loading model…</span></div>
</header>
<main id="main">
  <section>
    <h2>Prompt</h2>
    <label>Input text (chars outside the vocab are skipped and marked)</label>
    <input type="text" id="prompt" value="the she to" spellcheck="false">
    <div class="chips" id="prompt-chips"></div>
    <div class="row" style="margin-top:10px">
      <div><label>Tokens to generate</label><input type="number" id="ntokens" value="8" min="1" max="32"></div>
      <div><label>Temperature (greedy = off)</label>
        <select id="temp">
          <option value="greedy">greedy</option>
          <option value="0.5">0.5</option>
          <option value="0.8" selected>0.8</option>
          <option value="1.0">1.0</option>
          <option value="1.5">1.5</option>
        </select>
      </div>
      <div><label>Top-k (0 = off)</label><input type="number" id="topk" value="10" min="0" max="50"></div>
      <div><label>Seed</label><input type="number" id="seed" value="42" min="0"></div>
      <div><button id="btn-gen">Generate</button></div>
      <div><button id="btn-rec" class="secondary">Generate + record</button></div>
      <div><button id="btn-dl" class="secondary" disabled>Download record JSON</button></div>
    </div>
    <div id="status"></div>
    <section style="background:var(--panel2); margin-top:12px; border-color:var(--line)">
      <h2>Generated</h2>
      <div class="big-text" id="gen-text"></div>
      <div class="chips" id="gen-chips"></div>
      <div class="topbars" id="gen-top"></div>
    </section>
  </section>

  <section id="record-panel">
    <h2>Inference record</h2>
    <div class="kv" id="rec-meta"></div>
    <div class="steps" id="rec-steps"></div>
    <div class="row" style="margin-top:6px">
      <div><button id="btn-play" class="secondary">▶ play</button></div>
      <div class="note">Click any module or its inner stages to inspect the exact numbers.</div>
    </div>
    <div id="diagram-holder" style="margin-top:10px"></div>
    <section style="margin-top:12px" id="inspector">
      <h2 id="ins-title">Inspector</h2>
      <div id="ins-body"><p class="note">Pick a module in the diagram (or a step) to see its tensors and math.</p></div>
    </section>
  </section>
</main>

<script>
"use strict";
// ---------------------------------------------------------------------------
// State + API
// ---------------------------------------------------------------------------
let MODEL = null;      // /api/model response
let RECORD = null;     // last /api/record response
let CUR_STEP = 0;      // selected step index
let CUR_NODE = "softmax";
let HEAD = 0;          // selected attention head
let PLAY_TIMER = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function setStatus(msg) { $("status").textContent = msg || ""; }

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || (r.status + " " + r.statusText));
  return j;
}

function promptParams() {
  const t = $("temp").value;
  return {
    text: $("prompt").value,
    n_tokens: Math.max(1, Math.min(32, parseInt($("ntokens").value || "8", 10))),
    temperature: t === "greedy" ? null : parseFloat(t),
    top_k: parseInt($("topk").value || "0", 10),
    seed: parseInt($("seed").value || "42", 10),
  };
}

function tokenizePreview(text) {
  if (!MODEL || !MODEL.vocab) return;
  const idx = Object.fromEntries(MODEL.vocab.map((c, i) => [c, i]));
  const chips = [];
  let skipped = 0;
  for (const ch of text.toLowerCase()) {
    if (ch in idx) {
      chips.push(`<span class="chip" title="token ${idx[ch]}">${esc(ch)} <small>${idx[ch]}</small></span>`);
    } else if (ch.trim() !== "") {
      skipped++;
      chips.push(`<span class="chip" style="opacity:.4;text-decoration:line-through" title="not in vocab">${esc(ch)}</span>`);
    }
  }
  $("prompt-chips").innerHTML = chips.join("") + (skipped ? `<span class="note">${skipped} char(s) skipped (not in vocab)</span>` : "");
}

// ---------------------------------------------------------------------------
// Heatmaps / bars / formulas
// ---------------------------------------------------------------------------
function heatCSS(v, min, max) {
  const t = max > min ? (v - min) / (max - min) : 0.5;
  const r = Math.round(23 + 200 * (1 - t));
  const g = Math.round(27 + 90 * t);
  const b = Math.round(42 + 160 * t);
  return `rgb(${r},${g},${b})`;
}

function heatGrid(matrix, { cell = 16, title = "", labels = null, rows = null } = {}) {
  if (matrix.length === 1 && Array.isArray(matrix[0]) && Array.isArray(matrix[0][0]) && matrix[0].length > 1) matrix = matrix[0]; // (1,…) → drop batch
  const rowsArr = rows || matrix.length;
  const cols = matrix[0]?.length || 0;
  let min = Infinity, max = -Infinity;
  for (const r of matrix) for (const v of r) { if (v < min) min = v; if (v > max) max = v; }
  if (!isFinite(min)) { min = 0; max = 1; }
  const el = document.createElement("div");
  el.className = "heat";
  el.style.gridTemplateColumns = `repeat(${cols}, ${cell}px)`;
  for (let i = 0; i < rowsArr; i++) {
    for (let j = 0; j < cols; j++) {
      const c = document.createElement("i");
      if (cell <= 12) c.className = "tiny";
      const v = matrix[i][j];
      const num = typeof v === "number" ? v : 0;
      c.style.background = heatCSS(num, min, max);
      c.title = `${title} [${i}][${j}] = ${num}` + (labels && labels[j] !== undefined ? ` (${labels[j]})` : "");
      el.appendChild(c);
    }
  }
  return el;
}

function barChart(values, labels, { maxW = 200 } = {}) {
  const max = Math.max(...values.map((v) => Math.abs(v)), 1e-9);
  const wrap = document.createElement("div");
  wrap.className = "topbars";
  values.forEach((v, i) => {
    const row = document.createElement("div");
    row.className = "bar-row";
    const w = Math.round((Math.abs(v) / max) * maxW);
    row.innerHTML = `<span>${esc(labels?.[i] ?? i)}</span><span class="bar"><i style="width:${w}px"></i></span><span class="p">${v.toFixed(4)}</span>`;
    wrap.appendChild(row);
  });
  return wrap;
}

function matLabel(text) {
  const el = document.createElement("div");
  el.className = "matlabel";
  el.textContent = text;
  return el;
}

function formula(tex, note) {
  const el = document.createElement("div");
  el.className = "formula";
  const k = document.createElement("span");
  el.appendChild(k);
  el.dataset.tex = tex;
  if (note) {
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = note;
    el.appendChild(n);
  }
  return el;
}

function renderTex(el) {
  if (!window.katex) return;
  try {
    window.katex.render(el.dataset.tex, el, { throwOnError: false, displayMode: true });
  } catch (e) { el.textContent = el.dataset.tex; }
}

// ---------------------------------------------------------------------------
// Bootstrap
// ---------------------------------------------------------------------------
async function init() {
  MODEL = await api("/api/model");
  const c = MODEL.config;
  const badges = [
    [`V = ${c.vocab_size}`, "vocab size"],
    [`D = ${c.embed_dim}`, "embed dim"],
    [`L = ${c.n_layers}`, "layers"],
    [`H = ${c.n_heads}`, "heads"],
    [`ctx = ${c.context_length}`, "context"],
  ];
  if (MODEL.has_moe) badges.push([`E = ${c.n_experts}`, "MoE experts (top-k " + c.top_k + ")"]);
  badges.push([`${MODEL.n_params.toLocaleString()}`, "parameters"]);
  $("badges").innerHTML = badges.map(([v, t]) => `<span class="badge" title="${t}"><b>${v}</b> ${t}</span>`).join("");
  if (!MODEL.has_vocab) setStatus("This checkpoint has no vocab.json — text input unavailable.");
  $("prompt").addEventListener("input", () => tokenizePreview($("prompt").value));
  tokenizePreview($("prompt").value);
}

// ---------------------------------------------------------------------------
// Quick generation
// ---------------------------------------------------------------------------
async function doGenerate() {
  setStatus("generating…");
  try {
    const r = await api("/api/inference", promptParams());
    if (r.prompt) $("prompt").value = r.prompt.text;
    tokenizePreview(r.prompt.text);
    $("gen-text").textContent = r.generated.text;
    $("gen-chips").innerHTML = r.generated.tokens
      .map((t) => `<span class="chip gen" title="token ${t}">${esc(MODEL.vocab?.[t] ?? t)} <small>${t}</small></span>`)
      .join("");
    const top = r.last_step.top_tokens;
    $("gen-top").innerHTML = `<div class="matlabel">last position — top ${top.length} tokens</div>`;
    $("gen-top").appendChild(barChart(top.map((t) => t[1]), top.map((t) => MODEL.vocab?.[t[0]] ?? t[0])));
    setStatus(`done (${r.skipped_chars} skipped chars)`);
  } catch (e) {
    setStatus("error: " + e.message);
  }
}

// ---------------------------------------------------------------------------
// Full record + viewer
// ---------------------------------------------------------------------------
async function doRecord() {
  setStatus("running recorded generation…");
  try {
    RECORD = await api("/api/record", promptParams());
    CUR_STEP = RECORD.steps.length - 1;
    CUR_NODE = "softmax";
    renderRecordMeta();
    renderSteps();
    buildDiagram();
    selectStep(CUR_STEP);
    document.getElementById("main").classList.add("record-open");
    $("btn-dl").disabled = false;
    setStatus("record ready — click modules or inner stages to inspect them");
  } catch (e) {
    setStatus("error: " + e.message);
  }
}

function downloadRecord() {
  if (!RECORD) return;
  const blob = new Blob([JSON.stringify(RECORD, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "inference_record.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function fwd() { return RECORD.steps[CUR_STEP].forward; }
function seqLen() { return fwd().embedding[0].length; }
function dim() { return fwd().embedding[0][0].length; }

function renderRecordMeta() {
  const g = RECORD.generated;
  $("rec-meta").textContent =
    `prompt: ${RECORD.prompt.text} (${RECORD.prompt.tokens.join(",")}) → generated: "${g.text}" [${g.tokens.join(",")}] — ${RECORD.steps.length} step(s), each a full forward over the growing sequence`;
}

function renderSteps() {
  const el = $("rec-steps");
  el.innerHTML = "";
  RECORD.steps.forEach((s, i) => {
    const b = document.createElement("span");
    b.className = "step" + (i === CUR_STEP ? " active" : "");
    b.innerHTML = `s${i}: ${esc(MODEL.vocab?.[s.token] ?? s.token)}`;
    b.title = `token ${s.token}`;
    b.onclick = () => selectStep(i);
    el.appendChild(b);
  });
}

function selectStep(i) {
  CUR_STEP = i;
  document.querySelectorAll(".step").forEach((el, j) => el.classList.toggle("active", j === i));
  renderInspector();
}

function togglePlay() {
  if (PLAY_TIMER) {
    clearInterval(PLAY_TIMER);
    PLAY_TIMER = null;
    $("btn-play").textContent = "▶ play";
    return;
  }
  $("btn-play").textContent = "⏸ pause";
  let i = CUR_STEP;
  PLAY_TIMER = setInterval(() => {
    i = (i + 1) % RECORD.steps.length;
    selectStep(i);
  }, 1400);
}

// ---------------------------------------------------------------------------
// Architecture diagram — module boxes with inner-stage sub-nodes, arrows
// ---------------------------------------------------------------------------
const NS = "http://www.w3.org/2000/svg";
// layout constants (viewBox units)
const LW = 740, ML = 14;
const CX_L = ML, CW_L = 158;                       // left column (norms)
const CX_C = 196, CW_C = 340;                      // center column (modules)
const CX_R = 560, CW_R = 166;                      // right column (residuals)
const ROW_H = 104, ROW_GAP = 16, BLOCK_H = ROW_H * 2 + ROW_GAP;
const HEAD_H = 78, BLOCK_GAP = 44;

function svgEl(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  return el;
}

function buildDiagram() {
  const c = MODEL.config;
  const holder = $("diagram-holder");
  holder.innerHTML = "";
  const footY = HEAD_H + c.n_layers * (BLOCK_H + BLOCK_GAP);
  const totalH = footY + 150;
  const svg = svgEl("svg", { id: "diagram", viewBox: `0 0 ${LW} ${totalH}` });

  // arrow head
  const defs = svgEl("defs");
  const marker = svgEl("marker", { id: "arrow", viewBox: "0 0 10 10", refX: "8.5", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" });
  marker.appendChild(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#4a5468" }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  // edge: polyline with arrow at the end
  function edge(pts, dashed) {
    const p = svgEl("polyline", { points: pts.map(([x, y]) => `${x},${y}`).join(" "), class: "edge" + (dashed ? " dashed" : "") });
    p.setAttribute("marker-end", "url(#arrow)");
    svg.appendChild(p);
  }

  // simple node (no inner stages)
  function node(id, x, y, w, h, title, sub) {
    const g = svgEl("g", { class: "node" });
    g.dataset.id = id;
    const r = svgEl("rect", { class: "box", x, y, width: w, height: h, rx: 10 });
    g.appendChild(r);
    const t = svgEl("text", { class: "t-title", x: x + w / 2, y: sub ? y + h / 2 - 2 : y + h / 2 + 5, "text-anchor": "middle" });
    t.textContent = title;
    g.appendChild(t);
    if (sub) {
      const s = svgEl("text", { class: "t-sub", x: x + w / 2, y: y + h / 2 + 16, "text-anchor": "middle" });
      s.textContent = sub;
      g.appendChild(s);
    }
    g.addEventListener("click", () => selectNode(id));
    svg.appendChild(g);
  }

  // module box with inner-stage sub-nodes (each sub-node clickable)
  function module(id, x, y, w, h, title, cells) {
    const g = svgEl("g", { class: "node" });
    g.dataset.id = id;
    g.appendChild(svgEl("rect", { class: "mod", x, y, width: w, height: h, rx: 10 }));
    const t = svgEl("text", { class: "t-title", x: x + 10, y: y + 18 });
    t.textContent = title;
    g.appendChild(t);
    g.addEventListener("click", () => selectNode(id));
    svg.appendChild(g);
    // cells: rows of [label, subId]
    const nRows = cells.length;
    const top = y + 28;
    const cellH = Math.min(30, (h - 36) / nRows - 4);
    cells.forEach((row, ri) => {
      const cy = top + ri * (cellH + 4);
      const gap = 6, pad = 8;
      const cw = (w - 2 * pad - (row.length - 1) * gap) / row.length;
      row.forEach(([label, subId], ci) => {
        const cx = x + pad + ci * (cw + gap);
        const cg = svgEl("g", { class: "cell node" });
        cg.dataset.id = subId;
        cg.appendChild(svgEl("rect", { class: "box", x: cx, y: cy, width: cw, height: cellH, rx: 5 }));
        const ct = svgEl("text", { class: "t-cell", x: cx + cw / 2, y: cy + cellH / 2 + 3.5, "text-anchor": "middle" });
        ct.textContent = label;
        cg.appendChild(ct);
        cg.addEventListener("click", (ev) => { ev.stopPropagation(); selectNode(subId); });
        svg.appendChild(cg);
        // intra-module flow arrow between consecutive cells
        if (ci < row.length - 1) {
          const a = svgEl("line", { x1: cx + cw + 1, y1: cy + cellH / 2, x2: cx + cw + gap - 1.5, y2: cy + cellH / 2, class: "edge", "marker-end": "url(#arrow)" });
          svg.appendChild(a);
        }
      });
    });
  }

  // ---- header: embedding + positions ------------------------------------
  const embX = 220, embW = 210, posX = 460, posW = 180, headY = 8;
  node("emb", embX, headY, embW, 56, "token embedding", "ids → vectors (S, D)");
  node("pos", posX, headY, posW, 56, "positions · RoPE", "0…S-1 → rotary angles");

  // ---- blocks -------------------------------------------------------------
  const blockTops = [];
  for (let i = 0; i < c.n_layers; i++) {
    const by = HEAD_H + i * (BLOCK_H + BLOCK_GAP);
    blockTops.push(by);
    const lbl = svgEl("text", { class: "blklabel", x: ML, y: by - 8 });
    lbl.textContent = `block ${i}`;
    svg.appendChild(lbl);
    const r1 = by, r2 = by + ROW_H + ROW_GAP;

    // row 1: ln1 → attention → h
    module(`b${i}.ln1`, CX_L, r1, CW_L, ROW_H, "LN 1 · RMSNorm", [[["rms", `b${i}.ln1`], ["×γ", `b${i}.ln1`]]]);
    module(`b${i}.attn`, CX_C, r1, CW_C, ROW_H, "attention", [
      [["Q=xWq", `b${i}.attn.q`], ["K=xWk", `b${i}.attn.k`], ["V=xWv", `b${i}.attn.v`], ["RoPE", `b${i}.attn.rope`]],
      [["QKᵀ/√d", `b${i}.attn.scores`], ["causal mask", `b${i}.attn.mask`], ["softmax", `b${i}.attn.softmax`], ["A·V → Wo", `b${i}.attn.o`]],
    ]);
    node(`b${i}.h`, CX_R, r1, CW_R, ROW_H, "h = x + attn", "residual");

    // row 2: ln2 → ffn/moe → out
    module(`b${i}.ln2`, CX_L, r2, CW_L, ROW_H, "LN 2 · RMSNorm", [[["rms", `b${i}.ln2`], ["×γ", `b${i}.ln2`]]]);
    if (MODEL.has_moe) {
      module(`b${i}.ffn`, CX_C, r2, CW_C, ROW_H, "MoE feed-forward", [
        [["router", `b${i}.ffn.router`], ["top-k", `b${i}.ffn.topk`], ["renorm Σw=1", `b${i}.ffn.weights`], [`experts ×${c.n_experts}`, `b${i}.ffn.experts`], ["Σ wⱼ·Eⱼ(x)", `b${i}.ffn.sum`]]
      ]);
    } else {
      module(`b${i}.ffn`, CX_C, r2, CW_C, ROW_H, "FFN · SwiGLU", [
        [["gate=SiLU(XWg)", `b${i}.ffn.gate`], ["up=XWu", `b${i}.ffn.up`], ["gate⊙up", `b${i}.ffn.mul`], ["·Wd", `b${i}.ffn.down`]]
      ]);
    }
    node(`b${i}.out`, CX_R, r2, CW_R, ROW_H, "out = h + ffn", "block output");

    // edges
    const mid1 = r1 + ROW_H / 2, mid2 = r2 + ROW_H / 2;
    edge([[CX_L + CW_L, mid1], [CX_C - 3, mid1]]);
    edge([[CX_C + CW_C, mid1], [CX_R - 3, mid1]]);
    edge([[CX_L + CW_L, mid2], [CX_C - 3, mid2]]);
    edge([[CX_C + CW_C, mid2], [CX_R - 3, mid2]]);
    // h (bottom) → down → left → LN2 top
    edge([[CX_R + CW_R / 2, r1 + ROW_H], [CX_R + CW_R / 2, r1 + ROW_H + ROW_GAP / 2], [CX_L + CW_L / 2, r1 + ROW_H + ROW_GAP / 2], [CX_L + CW_L / 2, r2 - 3]]);
    // block output → next block LN1 (or footer)
    const nextTop = i + 1 < c.n_layers ? HEAD_H + (i + 1) * (BLOCK_H + BLOCK_GAP) : footY + 18;
    edge([[CX_R + CW_R / 2, r2 + ROW_H], [CX_R + CW_R / 2, r2 + ROW_H + BLOCK_GAP / 2], [CX_L + CW_L / 2, r2 + ROW_H + BLOCK_GAP / 2], [CX_L + CW_L / 2, nextTop - 3]]);
  }

  // header → block 0
  edge([[embX + embW / 2, headY + 56], [embX + embW / 2, HEAD_H - 14], [CX_L + CW_L / 2, HEAD_H - 14], [CX_L + CW_L / 2, blockTops[0] - 3]]);
  edge([[posX + posW / 2, headY + 56], [posX + posW / 2, HEAD_H - 14 + 24], [CX_C + CW_C / 2, HEAD_H - 14 + 24], [CX_C + CW_C / 2, blockTops[0] - 3]], true);

  // ---- footer: final norm → lm_head → softmax -----------------------------
  const fy = footY;
  node("fnorm", CX_L, fy + 18, CW_L, 62, "final norm", "RMSNorm");
  node("lmhead", CX_C, fy + 18, CW_C, 62, "lm_head", "normed @ W  →  (S, V) logits");
  node("softmax", CX_R, fy + 18, CW_R, 62, "softmax + argmax", "next token");
  edge([[CX_L + CW_L, fy + 49], [CX_C - 3, fy + 49]]);
  edge([[CX_C + CW_C, fy + 49], [CX_R - 3, fy + 49]]);

  holder.appendChild(svg);
  selectNode(CUR_NODE);
}

function selectNode(id) {
  CUR_NODE = id;
  document.querySelectorAll("#diagram .node").forEach((n) => n.classList.toggle("active", n.dataset.id === id));
  renderInspector();
}

// ---------------------------------------------------------------------------
// Inspector — one view per node id
// ---------------------------------------------------------------------------
function drop(el) { el.innerHTML = ""; return el; }

function normView(title, rec) {
  const rms = rec.rms[0].map((v) => v[0]);
  return (body) => {
    body.appendChild(formula(
      "\\hat{x}_d = \\dfrac{x_d}{\\sqrt{\\tfrac{1}{D}\\textstyle\\sum_{d} x_d^2 + \\varepsilon}}, \\qquad y_d = \\gamma_d \\cdot \\hat{x}_d",
      `rms (per row, sqrt(mean(x²)+eps)): [${rms.map((v) => v.toFixed(3)).join(", ")}]`
    ));
    body.appendChild(matLabel("γ — the per-channel learned scale, (D,)"));
    body.appendChild(matLabel(`output y = γ·x/rms, (S=${seqLen()}, D=${dim()})`));
    body.appendChild(heatGrid(rec.out, { cell: 14, title: "y" }));
  };
}

function attnSubView(sub, bIdx) {
  const a = fwd().blocks[bIdx].attn;
  const H = MODEL.config.n_heads, hd = MODEL.config.embed_dim / H;
  const headSel = (body) => {
    const headSelEl = document.createElement("div");
    headSelEl.className = "sel-head";
    for (let h = 0; h < H; h++) {
      const b = document.createElement("button");
      b.textContent = "head " + h;
      b.className = h === HEAD ? "on" : "";
      b.onclick = () => { HEAD = h; renderInspector(); };
      headSelEl.appendChild(b);
    }
    body.appendChild(headSelEl);
  };
  if (sub === "attn") {
    return (body) => {
      body.appendChild(formula(
        "q = x W_q,\\; k = x W_k,\\; v = x W_v \\;\\Rightarrow\\; s_{ij} = \\dfrac{q_i \\cdot k_j}{\\sqrt{d}} \\;\\text{(causal: } j>i \\Rightarrow -\\infty)",
        "click an inner stage (Q, K, V, RoPE, QKᵀ/√d, mask, softmax, A·V) for its numbers"
      ));
      body.appendChild(formula("A = \\text{softmax}(s),\\qquad \\text{ctx} = A\\,v,\\qquad \\text{out} = \\text{ctx}\\,W_o", "per-head: (S, d) each"));
      headSel(body);
      const q = a.q[0][HEAD], k = a.k[0][HEAD], sm = a.scores_masked[0][HEAD], aw = a.attn_weights[0][HEAD];
      body.appendChild(matLabel(`q (S, d=${hd}) post-RoPE`));
      body.appendChild(heatGrid(q, { cell: 14, title: "q" }));
      body.appendChild(matLabel(`k (S, d=${hd}) post-RoPE`));
      body.appendChild(heatGrid(k, { cell: 14, title: "k" }));
      body.appendChild(matLabel("scores after causal mask"));
      body.appendChild(heatGrid(sm, { cell: 12, title: "s̄" }));
      body.appendChild(matLabel("attention weights A — rows sum to 1"));
      body.appendChild(heatGrid(aw, { cell: 12, title: "A" }));
      body.appendChild(matLabel("ctx = A·v, (S, H·d)"));
      body.appendChild(heatGrid(a.ctx[0], { cell: 14, title: "ctx" }));
    };
  }
  if (sub === "q" || sub === "k" || sub === "v") {
    return (body) => {
      const name = sub.toUpperCase();
      body.appendChild(formula(`${name} = x W_${name[0] === "V" ? "v" : name[0].toLowerCase()}`, `the ${name} projection of LN2's output — (S, ${H * hd})`));
      body.appendChild(matLabel(`${name}_pre (S, ${H * hd}) — before head split / RoPE`));
      body.appendChild(heatGrid(a[sub + "_pre"][0], { cell: 12, title: name + "_pre" }));
      if (sub !== "v") {
        headSel(body);
        body.appendChild(matLabel(`${name} post-RoPE, head ${HEAD} (S, ${hd})`));
        body.appendChild(heatGrid(a[sub][0][HEAD], { cell: 14, title: name }));
      }
    };
  }
  if (sub === "rope") {
    return (body) => {
      body.appendChild(formula(
        "\\theta_{\\text{pair}} = 10000^{-2i/d},\\qquad \\text{angle} = \\text{pos} \\cdot \\theta, \\qquad (x_0, x_1) \\mapsto (x_0\\cos\\theta - x_1\\sin\\theta,\\; x_0\\sin\\theta + x_1\\cos\\theta)",
        "the position enters the model ONLY through these rotations of q and k (no learned position embedding)"
      ));
      body.appendChild(matLabel(`per-pair freqs (d/2 = ${hd / 2}): ${a.rope.freqs.map((v) => v.toFixed(4)).join(", ")}`));
      body.appendChild(matLabel("angles[pos 0] and cos/sin of the first pair"));
      body.appendChild(heatGrid(a.rope.cos[0], { cell: 14, title: "cos" }));
      body.appendChild(heatGrid(a.rope.sin[0], { cell: 14, title: "sin" }));
      headSel(body);
      body.appendChild(matLabel(`q post-RoPE, head ${HEAD}`));
      body.appendChild(heatGrid(a.q[0][HEAD], { cell: 14, title: "q" }));
    };
  }
  if (sub === "scores") {
    return (body) => {
      body.appendChild(formula("s_{ij} = \\dfrac{q_i \\cdot k_j}{\\sqrt{d}}", "before the causal mask — the upper triangle is not masked yet"));
      headSel(body);
      body.appendChild(matLabel(`raw scores, head ${HEAD} (S, S)`));
      body.appendChild(heatGrid(a.scores[0][HEAD], { cell: 12, title: "s" }));
      body.appendChild(matLabel("after causal mask (j>i → −∞)"));
      body.appendChild(heatGrid(a.scores_masked[0][HEAD], { cell: 12, title: "s̄" }));
    };
  }
  if (sub === "mask") {
    return (body) => {
      body.appendChild(formula("\\text{mask}_{ij} = [j > i]", "causality: a position can only attend to itself and the past"));
      body.appendChild(matLabel("causal mask (1 = masked)"));
      body.appendChild(heatGrid(a.causal_mask, { cell: 12, title: "mask" }));
      headSel(body);
      body.appendChild(matLabel("masked scores"));
      body.appendChild(heatGrid(a.scores_masked[0][HEAD], { cell: 12, title: "s̄" }));
    };
  }
  if (sub === "softmax") {
    return (body) => {
      body.appendChild(formula("A_{ij} = \\dfrac{e^{s_{ij}}}{\\sum_{j'\\le i} e^{s_{ij'}}}", "rows sum to 1 over the causal prefix"));
      headSel(body);
      body.appendChild(matLabel(`attention weights, head ${HEAD} (S, S)`));
      body.appendChild(heatGrid(a.attn_weights[0][HEAD], { cell: 12, title: "A" }));
    };
  }
  if (sub === "o") {
    return (body) => {
      body.appendChild(formula("\\text{ctx} = A\\,v \\in \\mathbb{R}^{S \\times H d}, \\qquad \\text{out} = \\text{ctx}\\,W_o \\in \\mathbb{R}^{S \\times D}", "head outputs are concatenated and projected back to the model width"));
      body.appendChild(matLabel("ctx (S, H·d) — heads merged"));
      body.appendChild(heatGrid(a.ctx[0], { cell: 12, title: "ctx" }));
      if (a.attn_out) {
        body.appendChild(matLabel("out = ctx·Wo (S, D) — goes into the residual"));
        body.appendChild(heatGrid(a.attn_out[0], { cell: 14, title: "out" }));
      }
    };
  }
  return null;
}

function ffnSubView(sub, bIdx) {
  const fr = fwd().blocks[bIdx];
  const m = fr.moe || fr.ffn;
  if (!fr.moe) {
    if (sub === "ffn") {
      return (body) => {
        body.appendChild(formula("\\text{gate} = \\text{SiLU}(x W_g),\\; \\text{up} = x W_u,\\; \\text{out} = (\\text{gate}\\odot\\text{up})W_d", `SiLU(z)=z·σ(z); FF width = ${m.ff_dim} (4·D)`));
        body.appendChild(matLabel("gate = SiLU(x·Wg), (S, FF)"));
        body.appendChild(heatGrid(m.gate[0], { cell: 11, title: "gate" }));
        body.appendChild(matLabel("gated = gate ⊙ up"));
        body.appendChild(heatGrid(m.gated[0], { cell: 11, title: "gated" }));
        body.appendChild(matLabel("out (S, D)"));
        body.appendChild(heatGrid(m.out[0], { cell: 14, title: "out" }));
      };
    }
    if (sub === "gate") {
      return (body) => {
        body.appendChild(formula("\\text{pre} = x W_g, \\qquad \\text{gate} = \\text{SiLU}(\text{pre}) = \\text{pre}\\cdot\\sigma(\text{pre})", `intermediate width FF = ${m.ff_dim}`));
        body.appendChild(matLabel("pre_gate (S, FF)"));
        body.appendChild(heatGrid(m.pre_gate[0], { cell: 11, title: "pre" }));
        body.appendChild(matLabel("gate (S, FF)"));
        body.appendChild(heatGrid(m.gate[0], { cell: 11, title: "gate" }));
      };
    }
    if (sub === "up") {
      return (body) => {
        body.appendChild(formula("\\text{up} = x W_u", "the un-gated projection, same width as the gate"));
        body.appendChild(matLabel("up (S, FF)"));
        body.appendChild(heatGrid(m.up[0], { cell: 11, title: "up" }));
      };
    }
    if (sub === "mul") {
      return (body) => {
        body.appendChild(formula("\\text{gated} = \\text{gate} \\odot \\text{up}", "element-wise: the SiLU gate modulates the up-projection"));
        body.appendChild(matLabel("gated (S, FF)"));
        body.appendChild(heatGrid(m.gated[0], { cell: 11, title: "gated" }));
      };
    }
    if (sub === "down") {
      return (body) => {
        body.appendChild(formula("\\text{out} = \\text{gated}\\, W_d", "projects back from FF to D"));
        body.appendChild(matLabel("out (S, D)"));
        body.appendChild(heatGrid(m.out[0], { cell: 14, title: "out" }));
      };
    }
    return null;
  }
  // MoE
  if (sub === "ffn") {
    return (body) => {
      body.appendChild(formula(
        "p = \\text{softmax}(x W_{\\text{gate}}),\\; \\hat{p} = \\dfrac{\\text{top-k}(p)}{\\sum \\text{top-k}(p)},\\; \\text{out} = \\sum_{j\\in\\text{top-k}} \\hat{p}_j E_j(x)",
        `router picks top-${m.top_k} of ${m.n_experts} experts; selected probabilities are renormalized into mixing weights`
      ));
      body.appendChild(matLabel("router scores (S, E)"));
      body.appendChild(heatGrid(m.scores[0], { cell: 16, title: "scores", labels: m.scores[0].map((_, j) => "E" + j) }));
      body.appendChild(matLabel("top-k picks (S, k)"));
      body.appendChild(heatGrid(m.topk_idx[0], { cell: 16, title: "topk" }));
      body.appendChild(matLabel("weights (S, E)"));
      body.appendChild(heatGrid(m.weights[0], { cell: 16, title: "w" }));
      m.expert_outs.forEach((eo, j) => {
        body.appendChild(matLabel(`expert ${j} output (S, D)`));
        body.appendChild(heatGrid(eo[0], { cell: 11, title: "E" + j }));
      });
      body.appendChild(matLabel("out (S, D)"));
      body.appendChild(heatGrid(m.out[0], { cell: 14, title: "out" }));
    };
  }
  if (sub === "router") {
    return (body) => {
      body.appendChild(formula("s = x W_{\\text{gate}} \\in \\mathbb{R}^{E}, \\qquad p = \\text{softmax}(s)", "one router matrix scores every expert for every position"));
      body.appendChild(matLabel("scores (S, E) — stable-softmaxed"));
      body.appendChild(heatGrid(m.scores[0], { cell: 16, title: "s", labels: m.scores[0].map((_, j) => "E" + j) }));
      body.appendChild(matLabel("probs (S, E) before top-k mask"));
      body.appendChild(barChart(m.weights[0][0], m.weights[0][0].map((_, j) => "E" + j)));
    };
  }
  if (sub === "topk") {
    return (body) => {
      body.appendChild(formula("\\text{topk} = \\arg\\text{top-}\\kappa(p)", `each position keeps its ${m.top_k} highest-probability expert(s)`));
      body.appendChild(matLabel("selected experts (S, k)"));
      body.appendChild(heatGrid(m.topk_idx[0], { cell: 18, title: "topk", labels: m.scores[0].map((_, j) => "E" + j) }));
    };
  }
  if (sub === "weights") {
    return (body) => {
      body.appendChild(formula("\\hat{p}_j = \\dfrac{p_j \\cdot \\mathbb{1}[j\\in\\text{topk}]}{\\sum_{j'} p_{j'} \\mathbb{1}[j'\\in\\text{topk}]} \\;\\Rightarrow\\; \\sum_j \\hat{p}_j = 1", "zero for non-selected experts, renormalized over the selected ones"));
      body.appendChild(matLabel("weights (S, E)"));
      body.appendChild(heatGrid(m.weights[0], { cell: 16, title: "w", labels: m.weights[0].map((_, j) => "E" + j) }));
    };
  }
  if (sub === "experts") {
    return (body) => {
      body.appendChild(formula("E_j(x): each expert is a full SwiGLU FFN", "every expert evaluates x; only the selected ones contribute (dense evaluation)"));
      m.expert_outs.forEach((eo, j) => {
        body.appendChild(matLabel(`expert ${j} output (S, D)`));
        body.appendChild(heatGrid(eo[0], { cell: 11, title: "E" + j }));
      });
    };
  }
  if (sub === "sum") {
    return (body) => {
      body.appendChild(formula("\\text{out} = \\sum_j \\hat{p}_j \\, E_j(x)", "weighted sum of the selected experts' outputs"));
      body.appendChild(matLabel("out (S, D)"));
      body.appendChild(heatGrid(m.out[0], { cell: 14, title: "out" }));
    };
  }
  return null;
}

function renderInspector() {
  const body = drop($("ins-body"));
  if (!RECORD) return;
  const title = $("ins-title");
  const id = CUR_NODE;
  const f = fwd();
  const seqS = seqLen();
  const D = dim();
  const vocab = MODEL.vocab || [];
  let view = null;

  if (id === "emb") {
    title.textContent = "Token embedding";
    view = (body) => {
      const s = RECORD.steps[CUR_STEP];
      body.appendChild(formula("x_{\\text{emb}}[s, d] = E[\\text{token}_s, d]", "a pure table lookup — (V, D) row gather, no arithmetic"));
      body.appendChild(matLabel(`tokens: ${s.input_tokens.join(", ")} → "${s.input_tokens.map((t) => vocab[t] ?? t).join("")}"`));
      body.appendChild(heatGrid(f.embedding[0], { cell: 14, title: "emb" }));
      body.appendChild(matLabel(`(S=${seqS}, D=${D})`));
    };
  } else if (id === "pos") {
    title.textContent = "Positions → RoPE (no learned position embedding)";
    const a = f.blocks[0].attn;
    view = (body) => {
      body.appendChild(formula("\\text{angle} = \\text{pos} \\cdot 10000^{-2i/d}", "positions are 0…S-1; they enter the model only as rotary angles applied to q and k inside attention"));
      body.appendChild(matLabel(`positions: ${f.positions.join(", ")}`));
      body.appendChild(matLabel("cos / sin angles (S, pairs) — block 0, head 0"));
      body.appendChild(heatGrid(a.rope.cos[0], { cell: 12, title: "cos" }));
      body.appendChild(heatGrid(a.rope.sin[0], { cell: 12, title: "sin" }));
    };
  } else if (id === "fnorm") {
    title.textContent = "Final norm — RMSNorm before lm_head";
    view = normView(id, f.final_norm);
  } else if (id === "lmhead" || id === "softmax") {
    const s = RECORD.steps[CUR_STEP];
    if (id === "lmhead") title.textContent = "lm_head — projection to vocabulary";
    else title.textContent = "softmax — next-token distribution";
    view = (body) => {
      if (id === "lmhead") {
        body.appendChild(formula("z_s = \\text{normed}_s \\, W_{\\text{lm}}", "every position's vector is projected to all V vocab logits — (S, V)"));
      } else {
        body.appendChild(formula("p_i = \\dfrac{e^{z_i}}{\\sum_j e^{z_j}}, \\qquad \\hat{t} = \\arg\\max_i p_i", "greedy = argmax; sampling draws from p (with temperature / top-k)"));
        body.appendChild(matLabel(`this step picked token ${s.token} ("${vocab[s.token] ?? s.token}")`));
      }
      const last = id === "lmhead" ? f.logits[0][seqS - 1] : f.softmax[0][seqS - 1];
      body.appendChild(matLabel(`logits / probabilities of the last position (V = ${MODEL.config.vocab_size})`));
      body.appendChild(heatGrid([last], { cell: 18, title: id === "lmhead" ? "z" : "p", labels: vocab }));
      body.appendChild(matLabel("top-10 at the last position"));
      body.appendChild(barChart(s.top_tokens.map((t) => t[1]), s.top_tokens.map((t) => `${vocab[t[0]] ?? t[0]} (${t[0]})`)));
    };
  } else {
    const mBlock = /^b(\d+)\./ .exec(id);
    if (mBlock) {
      const b = +mBlock[1];
      const rest = id.slice((mBlock[0]).length);
      const mSub = rest.match(/^(ln1|ln2|attn|ffn|h|out)(?:\.(.+))?$/);
      if (mSub) {
        const what = mSub[1], sub = mSub[2];
        if (what === "ln1" || what === "ln2") {
          title.textContent = `block ${b} — ${what === "ln1" ? "input" : "post-attention"} norm (RMSNorm)`;
          view = normView(id, f.blocks[b][what]);
        } else if (what === "attn") {
          title.textContent = sub ? `block ${b} — attention / ${sub}` : `block ${b} — attention`;
          view = attnSubView(sub || "attn", b);
        } else if (what === "ffn") {
          title.textContent = sub ? `block ${b} — feed-forward / ${sub}` : `block ${b} — feed-forward`;
          view = ffnSubView(sub || "ffn", b);
        } else {
          const isH = what === "h";
          title.textContent = `block ${b} — ${isH ? "residual after attention" : "block output"}`;
          const val = f.blocks[b][what];
          view = (body) => {
            body.appendChild(formula(isH ? "h = x + \\text{attn}(x)" : "\\text{out} = h + \\text{ffn}(h)",
              isH ? "residual stream after attention — the skip connection that makes depth stable" : "block output — becomes the next block's input"));
            body.appendChild(matLabel(`(S=${seqS}, D=${D})`));
            body.appendChild(heatGrid(val[0], { cell: 14, title: what }));
          };
        }
      }
    }
  }

  if (!view) {
    body.innerHTML = '<p class="note">Pick a module in the diagram to see its tensors and math.</p>';
    return;
  }
  view(body);
  body.querySelectorAll(".formula").forEach(renderTex);
}

$("btn-gen").onclick = doGenerate;
$("btn-rec").onclick = doRecord;
$("btn-dl").onclick = downloadRecord;
$("btn-play").onclick = togglePlay;

init().catch((e) => setStatus("model load error: " + e.message));
